services:
    qbittorrent-nox:
        image: ghcr.io/qbittorrent/docker-qbittorrent-nox:5.2.3-1
        container_name: qbittorrent
        environment:
            - PUID=1000
            - PGID=988
            - TZ=Europe/Warsaw
            - QBT_LEGAL_NOTICE="confirm"
            - QBT_WEBUI_PORT=10002
            - QBT_TORRENTING_PORT=50466
        volumes:
            - scripts:/scripts
            - config:/config
            - downloads:/downloads
        ports:
            - "10002:10002/tcp"
            - "50466:50466/tcp"
            - "50466:50466/udp"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.qbittorrent-router.rule=Host(`qbittorrent.intranet.xbhl.online`)"
            - "traefik.http.routers.qbittorrent-router.entrypoints=websecure"
            - "traefik.http.routers.qbittorrent-router.tls=true"
            - "traefik.http.routers.qbittorrent-router.service=qbittorrent"
            - "traefik.http.services.qbittorrent.loadbalancer.server.port=10002"
            - "traefik.docker.network=proxy"
            - 'wud.watch=true'
            - 'wud.tag.include=^\d+\.\d+\.\d+-\d+$$'
            - "wud.link.template=https://github.com/qbittorrent/qBittorrent/releases/tag/release-$${major}.$${minor}.$${patch}"
        healthcheck:
            test: /bin/sh /scripts/healthcheck.sh /downloads http://127.0.0.1:10002
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - proxy
        restart: unless-stopped

volumes:
    scripts:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "./scripts"

    config:
        driver: local

    downloads:
        driver: local
        driver_opts:
            type: nfs
            o: addr=nas.srv.xbhl.intranet,rw,soft,timeo=100,nolock
            device: nas.srv.xbhl.intranet:/share/NFSv=4/Media/Torrent

networks:
    proxy:
        external: true
